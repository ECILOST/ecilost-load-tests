# Observabilidad de las pruebas de rendimiento: Prometheus, Grafana y exportadores. La incluye
# el docker-compose.yml de la raiz (mismo proyecto y red que el sistema bajo prueba, asi
# Prometheus alcanza los servicios por nombre). Las series y los tableros viven en volumenes
# propios: reiniciar o reconstruir el sistema no los borra.
#
# Dos fuentes de metricas que no se mezclan:
# - k6 empuja las suyas por remote write (lado cliente: lo que vive el usuario).
# - Prometheus raspa servicios, Postgres, RabbitMQ y contenedores (lado servidor).
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      # Receptor de `k6 run -o experimental-prometheus-rw`.
      - --web.enable-remote-write-receiver
      # Las Trend de k6 llegan como histogramas nativos: percentiles reales por ventana.
      - --enable-feature=native-histograms
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Solo escucha en 127.0.0.1: se puede ver sin iniciar sesion; editar pide admin.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    ports:
      # 3000 lo usa auth.
      - "127.0.0.1:3300:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]

  # CPU, memoria, red y throttling por contenedor (ve tambien Postgres y RabbitMQ).
  #
  # Docker 29 guarda las imagenes en containerd (snapshotter) y el handler docker de cAdvisor
  # v0.52.1 falla ("failed to identify the read-write layer ID"). Se desactiva apuntandolo a
  # un socket inexistente y se usa el de containerd, namespace `moby`. Ese handler no expone
  # las etiquetas de compose: los contenedores se identifican por imagen.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - --docker=unix:///nonexistent.sock
      - --containerd=/var/run/containerd/containerd.sock
      - --containerd-namespace=moby
      - --housekeeping_interval=5s
      - --store_container_labels=false
      - --disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,percpu,process,referenced_memory,resctrl,sched,tcp,udp
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    command:
      # Consultas mas costosas (requiere pg_stat_statements, ver compose/postgres/init.sql).
      - --collector.stat_statements
    environment:
      DATA_SOURCE_URI: postgres:5432/postgres?sslmode=disable
      DATA_SOURCE_USER: ecilost
      DATA_SOURCE_PASS: ecilost

# Nombres fijos: conservan las series y los tableros aunque cambie el nombre del proyecto.
volumes:
  prometheus-data:
    name: ecilost-observability_prometheus-data
  grafana-data:
    name: ecilost-observability_grafana-data
