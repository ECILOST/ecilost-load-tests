# Limites de cada Container App en Azure (ecilost-terraform/modules/compute/variables.tf):
# 0.25 vCPU y 0.5 GiB, una replica. Con este overlay la capacidad medida se acerca a la de
# Azure; sin el, mide el techo del codigo con la CPU del equipo. Postgres y RabbitMQ no se
# limitan: en Azure son externos (Neon y CloudAMQP) y sus limites son otros.
services:
  auth:
    cpus: 0.25
    mem_limit: 512m
  catalog:
    cpus: 0.25
    mem_limit: 512m
  wallet:
    cpus: 0.25
    mem_limit: 512m
  auction:
    cpus: 0.25
    mem_limit: 512m
  engagement:
    cpus: 0.25
    mem_limit: 512m
